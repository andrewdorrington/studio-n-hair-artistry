    <script>
      // Load Picktime booking script after window load to avoid blocking TTI
      window.addEventListener('load', function () {
        (function(win, doc, tag, src, el, firstScript) {
          el = doc.createElement(tag);
          firstScript = doc.getElementsByTagName(tag)[0];
          el.async = true;
          el.defer = true;
          el.src = src;
          firstScript.parentNode.insertBefore(el, firstScript);
        })(window, document, "script", "https://www.picktime.com/assets/booking.js");
      });
    </script>
